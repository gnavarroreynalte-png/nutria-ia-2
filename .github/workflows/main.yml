name: Compilar mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ver archivos del repositorio
        run: |
          ls -la
          find src -type f | head -50
          test -f build.gradle || (echo "ERROR: build.gradle NO esta en la raiz" && exit 1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Compilar
        run: gradle build --no-daemon --stacktrace
      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: nutria-ia-mod
          path: build/libs/*.jar
